
<!DOCTYPE html>

<html>
<head>

    <title>My Favorites - Stat Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
{% include 'core/navbar.html' %}

<div class="container mt-5">

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

    <h1 class="mt-3">My Favorite Players</h1>

    {% for favorite in favorites %}

    <div class="card p-3 mb-2">

        <a href="{% url 'player_detail' favorite.player.id %}">
            {{ favorite.player.name }}

        </a>
        <p class="mb-0">{{ favorite.player.team.name }} - {{ favorite.player.position }}</p>
    </div>

    {% empty %}

    <p>You haven't saved any players yet.</p>
    {% endfor %}

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>



</html>
